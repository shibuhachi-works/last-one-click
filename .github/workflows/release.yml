name: リリースを作る

# 版のリリース(とタグ)を GitHub Actions に作らせる(手で起動する)。
# クラウドの作業環境(AI)からはタグの push もリリースの作成も止められるので、
# コミットを指定して起動すると、この workflow がリリースを作る。タグはリリースと一緒に GitHub が作る。
# 起動できるのはリポジトリに書き込める人だけ(workflow_dispatch の決まり)。
#
# タグについて: Actions の token は、main と比べて .github/workflows/ に差分があるコミットへ新しいタグを作れない
# (git push は「workflows の権限がない」と拒まれ、ref を作る API も 403。リリースの作成でタグを作る場合も同じ。
# `workflows` の権限は Actions の token には付けられない)。
# - main の先頭のように workflow の差分が無いコミットなら、この workflow がタグも作る(--target)
# - 古いコミット(workflow の差分がある)は、人が先にタグを打つ。タグが既にあれば、それを使ってリリースだけ作る
#
# リリースの本文は docs/releases/<タグ名>.md。無ければ止まる(文面は PR でレビューしてから置く)。
#
# ストアに出す ZIP(last-one-click-<版>.zip)も、この workflow がそのコミットから作って、リリースに添える。
# - ZIP は、指定したコミットを別の場所に取り出して作る(本文を読む main とは分ける)。manifest.json の version がタグと同じことを確かめる
# - ZIP を作る手順(npm ci・build)は、リリースを作る token を持たない手順で行う(npm ci は --ignore-scripts)
# - 本文の末尾に、ZIP の SHA-256 と「通常はストアから入れる」の注意を足す
# - ストアの画像(extension/store/*.png)が今のポップアップ・素材から作ったものか確かめ、古ければ止める(check-screenshots.mjs)
# - ストアには、リリースに添えた ZIP をそのまま上げる(手元で作り直さない。ZIP は作るたびに中身の時刻が変わる)
#
# ストアへのアップロード(#134): リリースに添えた ZIP を、Chrome Web Store API で上げるところまで行う(別のジョブ)。
# - 「審査のため送信」は人が押す(説明文・画像・プライバシーの回答を確かめてから)。この workflow は送信しない
# - Google には、鍵ファイルを置かずに GitHub の OIDC で入る(Workload Identity 連携)。id-token の権限は、上げるジョブにだけ付ける
#   (ZIP を作る手順で動く依存のコードに、Google に入る権限を渡さないため)
# - Variables(CWS_WIF_PROVIDER・CWS_SERVICE_ACCOUNT・CWS_PUBLISHER_ID)のどれかが無ければ、上げずに成功で終わる
# - upload_only を付けると、リリースは作らず、既にあるリリースの ZIP を上げるだけにする(上げるのだけ失敗したときのやり直し)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "タグ名(例: v0.1.1)。docs/releases/<タグ名>.md が本文になる"
        required: true
        type: string
      sha:
        description: "リリースするコミット(40 文字の SHA。main に入っているものだけ)。upload_only のときは使わない(空でよい)"
        required: false
        type: string
      upload_to_store:
        description: "リリースの ZIP を Chrome ウェブストアにアップロードする(審査のため送信はしない)"
        required: false
        type: boolean
        default: true
      upload_only:
        description: "リリースは作らず、既にあるリリースの ZIP をストアにアップロードするだけにする(やり直し用)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: リリースを作る
    if: ${{ !inputs.upload_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 入力を確かめて、ストアに出す ZIP を作る(リリースの token は渡さない)
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -eu
          # 形を確かめる(入力はそのまま git や gh に渡さず、env 経由で使う)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "タグ名は v1.2.3 の形にしてください: $TAG"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA は 40 文字の小文字の 16 進数にしてください: $SHA"; exit 1; }
          git cat-file -e "$SHA^{commit}" || { echo "コミットが見つかりません: $SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "main に入っていないコミットです: $SHA"; exit 1; }
          NOTES="docs/releases/$TAG.md"
          [[ -f "$NOTES" ]] || { echo "本文がありません: $NOTES(先に PR で置いてください)"; exit 1; }
          # 指定したコミットを別の場所に取り出して、そこで ZIP を作る
          SRC="$RUNNER_TEMP/src"
          git worktree add --detach "$SRC" "$SHA"
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('$SRC/extension/manifest.json','utf8')).version")
          [[ "v$VERSION" == "$TAG" ]] || { echo "manifest.json の version（$VERSION）がタグ（$TAG）と違います"; exit 1; }
          # ストアの画像が、今のポップアップ・素材から作ったものかを確かめる(古ければ止める)
          if [[ -f "$SRC/extension/store/check-screenshots.mjs" ]]; then
            ( cd "$SRC/extension" && node store/check-screenshots.mjs )
          else
            echo "このコミットには画像の確認が無いので、飛ばします"
          fi
          # 取り出した先の依存を入れる。インストール時のスクリプトは動かさない
          ( cd "$SRC" && npm ci --ignore-scripts )
          ( cd "$SRC/extension" && npm ci --ignore-scripts && node package.mjs )
          ZIP="$SRC/extension/release/last-one-click-$VERSION.zip"
          [[ -f "$ZIP" ]] || { echo "ZIP ができていません: $ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$ZIP" "$RUNNER_TEMP/assets/"
          ( cd "$RUNNER_TEMP/assets" && sha256sum "last-one-click-$VERSION.zip" | tee SHA256SUMS )
          echo "ZIP の中身:"; unzip -l "$RUNNER_TEMP/assets/last-one-click-$VERSION.zip"
      - name: リリースを作る(ZIP を添える)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -eu
          NOTES="docs/releases/$TAG.md"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "リリースは既にあります: $TAG"; exit 1
          fi
          # 本文の 1 行目(# 見出し)をタイトルにし、残りを本文にする
          TITLE=$(sed -n '1s/^#\+ *//p' "$NOTES")
          [[ -n "$TITLE" ]] || { echo "本文の 1 行目は「# タイトル」にしてください: $NOTES"; exit 1; }
          tail -n +2 "$NOTES" > "$RUNNER_TEMP/notes.md"
          ZIPNAME="last-one-click-${TAG#v}.zip"
          HASH=$(cut -d' ' -f1 "$RUNNER_TEMP/assets/SHA256SUMS")
          {
            echo
            echo "## ZIP の確認"
            echo
            echo "- ファイル: \`$ZIPNAME\`(Chrome ウェブストアに出した版と同じ ZIP です)"
            echo "- SHA-256: \`$HASH\`"
            echo "- 通常は、Chrome ウェブストアから入れてください(自動で更新されます)。この ZIP は、中身を確かめたい人向けです"
          } >> "$RUNNER_TEMP/notes.md"
          # タグが既にあれば、それが指すコミットを確かめて、そのタグでリリースを作る。無ければタグも一緒に作る
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            [[ "$TAG_SHA" == "$SHA" ]] || { echo "タグ $TAG は別のコミットを指しています: $TAG_SHA"; exit 1; }
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/assets/$ZIPNAME" "$RUNNER_TEMP/assets/SHA256SUMS"
            echo "既にあるタグでリリースを作りました: $TAG → $SHA"
          else
            gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/assets/$ZIPNAME" "$RUNNER_TEMP/assets/SHA256SUMS"
            echo "タグとリリースを作りました: $TAG → $SHA"
          fi

  store-upload:
    name: ストアにアップロードする
    needs: release
    # リリースを作ったとき(release が成功)か、upload_only のとき(release は飛ばされる)
    if: ${{ always() && inputs.upload_to_store && (needs.release.result == 'success' || (inputs.upload_only && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 設定があるかを見る
        id: config
        env:
          WIF: ${{ vars.CWS_WIF_PROVIDER }}
          SA: ${{ vars.CWS_SERVICE_ACCOUNT }}
          PUB: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          if [[ -n "$WIF" && -n "$SA" && -n "$PUB" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ストアへのアップロードは飛ばしました(設定が無い: Variables の CWS_WIF_PROVIDER・CWS_SERVICE_ACCOUNT・CWS_PUBLISHER_ID)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
      - name: リリースの ZIP を取ってきて確かめる
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "タグ名は v1.2.3 の形にしてください: $TAG"; exit 1; }
          VERSION="${TAG#v}"
          ZIPNAME="last-one-click-$VERSION.zip"
          mkdir -p "$RUNNER_TEMP/store"
          gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/store" --pattern "$ZIPNAME" --pattern SHA256SUMS
          ( cd "$RUNNER_TEMP/store" && sha256sum -c SHA256SUMS )
          ZIP_VERSION=$(unzip -p "$RUNNER_TEMP/store/$ZIPNAME" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          [[ "$ZIP_VERSION" == "$VERSION" ]] || { echo "ZIP の manifest.json の version（$ZIP_VERSION）がタグ（$TAG）と違います"; exit 1; }
      - name: Google に入る(鍵ファイルを使わない。Workload Identity 連携)
        if: steps.config.outputs.ready == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: ZIP をストアにアップロードする(審査のため送信はしない)
        if: steps.config.outputs.ready == 'true'
        env:
          TAG: ${{ inputs.tag }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          set -eu
          echo "::add-mask::$CWS_ACCESS_TOKEN"
          VERSION="${TAG#v}"
          node extension/store/cws-upload.mjs "$RUNNER_TEMP/store/last-one-click-$VERSION.zip" "$VERSION"
