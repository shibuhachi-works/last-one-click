name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  root:
    name: shared / Playwright 版(テスト・型チェック)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - run: npm ci
      # shared/*.dom.test.ts が実ブラウザを使う
      - run: npx playwright install --with-deps chromium
      # shared/extension-e2e.dom.test.ts がビルドした拡張(extension/dist)を Chromium に読み込む
      - run: npm ci && npm run build
        working-directory: extension
      - run: npm run typecheck
      # shared/no-unsafe-click.test.ts が extension/src と shared の全 .ts を検査する
      # (テストと extension/src/lib/safe-click.ts のみ除外)
      - run: npm test

  extension:
    name: Chrome 拡張(型チェック・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
